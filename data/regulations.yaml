# Registry of supported regulations.
#
# detect_markers decide which regulation a sheet follows. The patterns are
# spacing- and punctuation-tolerant because third-party sheets write the same
# instrument a dozen ways. Weight 3 names an instrument and can only mean one
# regulation; weight 1 is context that supports a reading without making it.
regulations:
  eu_clp:
    display_name: EU CLP
    revision: 02008R1272-20260701
    authority: Regulation (EC) No 1272/2008 (consolidated)
    official_languages:
    - bg
    - cs
    - da
    - de
    - el
    - en
    - es
    - et
    - fi
    - fr
    - ga
    - hr
    - hu
    - it
    - lt
    - lv
    - mt
    - nl
    - pl
    - pt
    - ro
    - sk
    - sl
    - sv
    required_languages: []
    supplemental_prefixes:
    - EUH
    allowed_prefixes:
    - H
    - P
    - EUH
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: http://publications.europa.eu/resource/celex/02008R1272-20260701
    detect_markers:
    - pattern: \(EC\)\s*No\.?\s*1272\s*/\s*2008|\b1272\s*/\s*2008\b
      weight: 3
    - pattern: \(EC\)\s*No\.?\s*1907\s*/\s*2006|\b1907\s*/\s*2006\b
      weight: 3
    - pattern: \(EU\)\s*2020\s*/\s*878|\b2020\s*/\s*878\b
      weight: 3
    - pattern: \bCLP\s*Regulation\b
      weight: 3
    - pattern: \bREACH\b
      weight: 1
    - pattern: \bEuropean\s+Union\b|\bEuropean\s+Parliament\b|\bOfficial\s+Journal\b
      weight: 1
  uk_clp:
    display_name: UK GB CLP
    revision: retained-1272-2008
    authority: GB CLP Regulation (retained EU law)
    official_languages:
    - en
    required_languages: []
    supplemental_prefixes:
    - EUH
    allowed_prefixes:
    - H
    - P
    - EUH
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: https://www.legislation.gov.uk/eur/2008/1272/contents
    detect_markers:
    - pattern: \bGB\s*CLP\b
      weight: 3
    - pattern: \bUK\s*REACH\b
      weight: 3
    - pattern: retained[^.]{0,60}1272\s*/\s*2008
      weight: 5
    - pattern: \bGreat\s+Britain\b
      weight: 1
  us_osha:
    display_name: US OSHA HazCom
    revision: 29-CFR-1910.1200-AppC
    authority: 29 CFR 1910.1200 Appendix C
    official_languages:
    - en
    required_languages: []
    supplemental_prefixes: []
    allowed_prefixes:
    - H
    - P
    ghs_edition: GHS Rev.7
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    statements_lack_terminal_punctuation: true
    source_url: https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.1200AppC
    detect_markers:
    - pattern: 29\s*CFR\s*1910(?:\s*\.?\s*1200)?
      weight: 3
    - pattern: \bHazard\s+Communication\s+Standard\b
      weight: 3
    - pattern: \bHazCom\s*2012\b|\bHCS\s*2012\b|\bOSHA\s*HCS\b
      weight: 3
    - pattern: \bOSHA\b
      weight: 2
  ca_whmis:
    display_name: Canada WHMIS
    revision: SOR-2015-17
    authority: Hazardous Products Regulations (SOR/2015-17)
    official_languages:
    - en
    - fr
    required_languages:
    - en
    - fr
    supplemental_prefixes: []
    allowed_prefixes:
    - H
    - P
    statements_lack_terminal_punctuation: true
    ghs_edition: GHS Rev.7
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: https://laws-lois.justice.gc.ca/eng/regulations/SOR-2015-17/FullText.html
    detect_markers:
    - pattern: \bWHMIS\b
      weight: 3
    - pattern: \bHazardous\s+Products\s+Regulations?\b
      weight: 3
    - pattern: \bSOR\s*/\s*2015\s*[-‐-―]\s*17\b
      weight: 3
    - pattern: \bHPR\b
      weight: 2
  un_ghs:
    display_name: UN GHS
    revision: Rev.11
    authority: UN GHS Rev.11, Annex 3
    official_languages:
    - ar
    - en
    - es
    - fr
    - ru
    - zh
    required_languages: []
    supplemental_prefixes: []
    allowed_prefixes:
    - H
    - P
    statements_lack_terminal_punctuation: true
    ghs_edition: GHS Rev.11
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: https://unece.org/transport/standards/transport/dangerous-goods/ghs-rev11-2025
    detect_markers:
    - pattern: \bGHS\s*Rev\.?\s*\d+\b
      weight: 2
    - pattern: \b(?:UN|United\s+Nations)\s+Globally\s+Harmoni[sz]ed\s+System\b
      weight: 2
    - pattern: \bGHS\b
      weight: 1
  au_whs:
    display_name: Australia WHS (GHS Rev.7 + AUH)
    revision: GHS-Rev7-AU
    authority: WHS Regulations; GHS Rev.7; Safe Work Australia AUH statements
    official_languages:
    - en
    required_languages: []
    supplemental_prefixes:
    - AUH
    allowed_prefixes:
    - H
    - P
    - AUH
    statements_lack_terminal_punctuation: true
    ghs_edition: GHS Rev.7
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: https://www.safeworkaustralia.gov.au/doc/ghs-classification-and-labelling-chemicals
    detect_markers:
    - pattern: \bSafe\s+Work\s+Australia\b
      weight: 3
    - pattern: \bWHS\s+Regulations?\b
      weight: 3
    - pattern: \bModel\s+Code\s+of\s+Practice\b
      weight: 3
    - pattern: \bWork\s+Health\s+and\s+Safety\b
      weight: 2
  jp_jis:
    display_name: Japan JIS Z 7252/7253
    revision: JIS-Z-7253-2019
    authority: JIS Z 7252 / JIS Z 7253 (paid standard)
    official_languages:
    - ja
    - en
    required_languages: []
    supplemental_prefixes: []
    allowed_prefixes:
    - H
    - P
    signal_words:
    - SIGNAL_DANGER
    - SIGNAL_WARNING
    source_url: null
    source_note: JIS is a paid standard; not scraped. Fill via `lingua keys import-csv`.
    detect_markers:
    - pattern: \bJIS\s*Z\s*7253\b|\bJIS\s*Z\s*7252\b
      weight: 3
    - pattern: \bIndustrial\s+Safety\s+and\s+Health\s+Act\b
      weight: 2
